name: Debug FUT.GG Momentum

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test FUT.GG Momentum
        run: |
          python - <<'PY'
          import requests
          import json

          session = requests.Session()

          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json",
              "Accept-Language": "en-US,en;q=0.9",
          })

          url = "https://www.fut.gg/players/momentum/"

          params = {
              "hours": '"6"',
              "page": "1",
              "price__gte": "300000",
              "price__lte": "3000000",
              "onlySpecialCards": "true"
          }

          print("=" * 60)
          print("FUT.GG MOMENTUM DEBUG")
          print("=" * 60)

          r = session.get(
              url,
              params=params,
              timeout=30
          )

          print()
          print("HTTP:", r.status_code)
          print("URL:", r.url)
          print("HTML length:", len(r.text))

          print()
          print("SEARCHING FOR API REFERENCES...")
          print("=" * 60)

          text = r.text

          keywords = [
              "/api/",
              "momentum",
              "players/v2",
              "onlySpecialCards",
              "price__gte",
              "price__lte",
              "hours",
              "__NEXT_DATA__",
              "self.__next_f"
          ]

          for keyword in keywords:

              print()
              print("###", keyword)

              start = 0
              found = 0

              while True:

                  index = text.find(
                      keyword,
                      start
                  )

                  if index == -1:
                      break

                  found += 1

                  beginning = max(
                      0,
                      index - 300
                  )

                  ending = min(
                      len(text),
                      index + 500
                  )

                  snippet = text[
                      beginning:ending
                  ]

                  print(snippet)
                  print("-" * 40)

                  start = index + len(keyword)

                  if found >= 5:
                      break

          print()
          print("=" * 60)
          print("DONE")
          print("=" * 60)
          PY